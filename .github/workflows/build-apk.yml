name: Build CADCraft APK

on:
  workflow_dispatch:   # tombol "Run workflow" manual di tab Actions
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_NDK_HOME: ${{ vars.ANDROID_NDK_HOME || '' }}

    steps:
      # 1. Ambil source code repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 (dibutuhkan Gradle / Android Gradle Plugin 8.x)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Android NDK (untuk compile Rust -> .so Android)
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # 5. Rust + target Android
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 6. Siapkan project Android.
      #    Repo CADCraft tidak punya folder android/ siap pakai, jadi project
      #    Android (GameActivity + Gradle) digenerate oleh builder artcraft-android.
      #    Kalau folder android/ sudah ada di repo kamu, langkah ini dilewati.
      - name: Generate Android project
        run: |
          if [ -f android/gradlew ]; then
            echo "Folder android/ sudah ada, skip generate."
          else
            git clone --depth 1 https://github.com/MostafaXS1/artcraft-android.git /tmp/builder
            cd /tmp/builder
            bash build.sh -cadcraft || echo "Builder selesai dengan warning, lanjut ke Gradle."
          fi

      # 7. Cari lokasi project Android (folder yang berisi gradlew)
      - name: Locate Android project
        run: |
          GRADLEW=$(find "$GITHUB_WORKSPACE" /tmp/builder -name gradlew -not -path '*/node_modules/*' 2>/dev/null | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan. Cek langkah 'Generate Android project'."
            exit 1
          fi
          ANDROID_DIR=$(dirname "$GRADLEW")
          echo "Android project: $ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV

      # 8. Paksa nama aplikasi jadi CADCraft
      - name: Enforce App Name
        run: |
          STRINGS="$ANDROID_DIR/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">CADCraft<\/string>/g' "$STRINGS"
            sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">CADCraft<\/string>/g' "$STRINGS"
            cat "$STRINGS"
          else
            echo "strings.xml tidak ada, skip."
          fi

      # 9. Fix error "Duplicate class kotlin.*" (samakan versi Kotlin stdlib)
      - name: Fix Kotlin Duplicate Classes
        run: |
          GRADLE_FILE="$ANDROID_DIR/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            cat << 'EOF' >> "$GRADLE_FILE"

          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("align with kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("align with kotlin-stdlib")
                  }
              }
          }
          EOF
          else
            echo "build.gradle tidak ditemukan (mungkin build.gradle.kts), skip."
          fi

      # 10. Build APK debug
      - name: Build Android Debug APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 11. Kumpulkan APK ke satu folder
      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          find "$ANDROID_DIR" -path '*outputs/apk/debug/*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-out/" \;
          ls -lh "$GITHUB_WORKSPACE/apk-out"

      # 12. Upload hasilnya (download dari tab Actions -> Artifacts)
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: CADCraft-Offline-APK
          path: apk-out/*.apk
          if-no-files-found: error
